# =============================================================================
# android-release.yml — build + sign ONE release APK. Android only, on purpose.
#
# This is the fork's own build workflow, called by fork-sync.yml via `uses:`.
# It deliberately does NOT reuse upstream's build.yml, for three reasons:
#   * build.yml is `assembleDebug` + lint — it never produces a shippable APK;
#   * it has an `ios` job on macos-15 that we have no use for and that burns
#     10x-billed macOS minutes on every push;
#   * upstream owns that file, so a sync merge can overwrite whatever we do to
#     it. Upstream has no `android-release.yml`, so this file survives merges.
#
# It can also be run on its own (workflow_dispatch) to rebuild a tag by hand.
#
# Artifact name: Pebble_<version>-<commit8>-<counter>.apk — the same shape
# androidApp/build.gradle.kts already produces for local builds
# (Pebble_<version>-<commit>-<buildType>.apk), with the pipeline's build counter
# in place of the build type, since everything published here is a release.
#
# The app is :androidApp (manifest, applicationId, signing, R8, google-services);
# :composeApp holds the shared code its Activity/Service classes live in.
# =============================================================================
name: android-release

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag, branch, or SHA to build"
        type: string
        required: true
      version_name:
        description: "Store version to stamp (-PpebbleVersionName)"
        type: string
        required: true
      commit_hash:
        description: "8-char upstream cutoff commit (-PpebbleCommitHash)"
        type: string
        required: true
      build_counter:
        description: "Monotonic per-version build number, used in the filename"
        type: string
        required: true
      run_tests:
        description: "Run the tasker-bridge unit tests (incl. the golden-JSON contract test)"
        type: boolean
        required: false
        default: true
    outputs:
      apk_name:
        description: "Filename of the signed APK inside the uploaded artifact"
        value: ${{ jobs.android.outputs.apk_name }}
      version_code:
        description: "versionCode baked into the APK (= commit count)"
        value: ${{ jobs.android.outputs.version_code }}
      artifact:
        description: "Name of the uploaded artifact holding the APK + .sha256"
        value: ${{ jobs.android.outputs.artifact }}
    secrets:
      APP_KEYSTORE_B64:
        required: true
      APP_KEYSTORE_PASSWORD:
        required: true
      APP_KEY_ALIAS:
        required: true
      APP_KEY_PASSWORD:
        required: false
      READ_PACKAGES_ACTOR:
        required: false
      READ_PACKAGES_TOKEN:
        required: false

  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch, or SHA to build"
        type: string
        required: true
      version_name:
        description: "Store version to stamp (e.g. 1.8.0.6)"
        type: string
        required: true
      commit_hash:
        description: "8-char upstream cutoff commit"
        type: string
        required: true
      build_counter:
        description: "Build number for the filename"
        type: string
        required: false
        default: "1"
      run_tests:
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.package.outputs.apk_name }}
      version_code: ${{ steps.package.outputs.version_code }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0        # versionCode = git rev-list --count HEAD
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (apksigner/zipalign)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-release-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            android-release-${{ runner.os }}-

      - name: Provision build inputs
        run: |
          set -eu
          # Firebase: committed dummy, same as upstream's build.yml.
          cp androidApp/src/google-services-dummy.json androidApp/src/google-services.json
          # CI release path (not the debug-signed LOCAL_RELEASE_BUILD shortcut),
          # so the real release signingConfig is exercised.
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "LOCAL_RELEASE_BUILD=false"
          } > local.properties

      - name: Build release APK
        id: build
        env:
          # The gradle release signingConfig reads ../keystore.jks + RELEASE_*.
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          # GitHub Packages read auth (mirrors upstream build.yml).
          GITHUB_ACTOR: ${{ secrets.READ_PACKAGES_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
        run: |
          set -eu
          printf '%s' "$APP_KEYSTORE_B64" | base64 -d > keystore.jks
          chmod 600 keystore.jks
          # APP_KEY_PASSWORD is an OPTIONAL secret, but the gradle release signingConfig reads
          # RELEASE_KEY_PASSWORD unconditionally — leaving it null fails signing. PKCS12 keys
          # normally share the store password, which is what sign.sh assumes too.
          export RELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
          TASKS=":androidApp:assembleRelease"
          if [ "${{ inputs.run_tests }}" = "true" ]; then
            TASKS="$TASKS :tasker-bridge:testDebugUnitTest"
          fi
          # Crashlytics mapping upload is excluded: the dummy google-services.json
          # has no real Firebase project, so the upload 400s. R8 + the signed APK
          # are unaffected (the mapping .txt is still produced locally).
          ./gradlew --no-daemon $TASKS \
            -PpebbleVersionName="${{ inputs.version_name }}" \
            -PpebbleCommitHash="${{ inputs.commit_hash }}" \
            -x uploadCrashlyticsMappingFileRelease

      - name: Upload build reports on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ inputs.build_counter }}
          path: |
            androidApp/build/reports/**
            composeApp/build/reports/**
            tasker-bridge/build/reports/**
          if-no-files-found: ignore

      # --- Name, sign, verify, checksum. --------------------------------------
      - name: Sign + package
        id: package
        env:
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -eu
          OUTDIR=androidApp/build/outputs/apk/release
          IN="$(find "$OUTDIR" -maxdepth 1 -name '*.apk' | head -n1)"
          test -n "$IN" || { echo "no release APK produced" >&2; exit 1; }

          APK="Pebble_${{ inputs.version_name }}-${{ inputs.commit_hash }}-${{ inputs.build_counter }}.apk"
          mkdir -p dist
          # sign.sh: zipalign -> apksigner sign -> apksigner verify -> zipalign -c
          sh tools/pipeline/lib/sign.sh "$IN" "dist/$APK"
          ( cd dist && sha256sum "$APK" > "${APK}.sha256" )

          VC="$(git rev-list --count HEAD)"
          {
            echo "apk_name=$APK"
            echo "version_code=$VC"
            echo "artifact=release-apk-${{ inputs.build_counter }}"
          } >> "$GITHUB_OUTPUT"
          echo "Built $APK (versionCode=$VC)"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
