# =============================================================================
# upstream-sync.yml — daily upstream-sync & release pipeline for the Pebble app
# fork (coredevices.coreapp). Implements HLDD-004 (Upstream-Sync & Release
# Pipeline), §4 activity flow and §10 file inventory.
#
# Once a day (or on manual dispatch) this:
#   detect : cheaply checks whether upstream `master` moved since our last build
#   build  : rebases our `tasker` patches onto upstream/master, runs the
#            tap-drift guard, builds + tests, signs + verifies, boots a KVM
#            emulator smoke, publishes a GitHub release, and advances state.
#
# All real logic lives in tools/pipeline/lib/*.sh; this workflow is the thin
# orchestrator (HLDD-004 §10). Every failure path opens an owner-assigned
# `pipeline` issue (§7) and stops, leaving the last-built SHA un-advanced so the
# next tick retries until a human resolves it.
#
# Third-party actions are PINNED BY COMMIT SHA (§9). Each external action below
# uses a clearly-marked `@<pin-sha>` placeholder + TODO — replace each with the
# real 40-hex commit SHA for the noted version tag before enabling the pipeline.
# First-party actions (actions/*) are pinned to major-version tags per the
# repo's existing convention (see .github/workflows/build.yml).
# =============================================================================
name: upstream-sync

on:
  schedule:
    # 0 10 * * * UTC == 03:00 America/Phoenix (MST, UTC-7, no DST). See §6.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if upstream master is unchanged"
        type: boolean
        required: false
        default: false

# Scoped exactly to what the pipeline needs (§9): publish releases + tags
# (contents) and file failure issues (issues).
permissions:
  contents: write
  issues: write

# Never run two syncs at once; a delayed tick is harmless (detect is idempotent
# on the SHA, §6). Don't cancel an in-flight build — let it finish.
concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/coredevices/mobileapp.git
  UPSTREAM_BRANCH: master
  TASKER_BRANCH: tasker
  STATE_BRANCH: pipeline-state
  STATE_FILE: tools/pipeline/state

jobs:
  # ---------------------------------------------------------------------------
  # DETECT (§4 step B/C): resolve upstream HEAD via `git ls-remote` and compare
  # to the last-built SHA stored on the `pipeline-state` branch. Exits quietly
  # (changed=false) when nothing moved, unless `force`.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      upstream_sha: ${{ steps.detect.outputs.upstream_sha }}
      last_built_sha: ${{ steps.detect.outputs.last_built_sha }}
    steps:
      - name: Check out pipeline scripts + state
        uses: actions/checkout@v4
        with:
          # We only need the helper scripts here; full history is fetched in
          # the build job. The `tasker` branch is the default working ref.
          ref: ${{ env.TASKER_BRANCH }}
          fetch-depth: 1

      - name: Fetch last-built SHA from pipeline-state
        # The state file lives on its own branch so it never collides with the
        # rebased `tasker` history. Pull it into tools/pipeline/state if present.
        run: |
          set -eu
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth 1 origin "$STATE_BRANCH"
            git show "origin/${STATE_BRANCH}:${STATE_FILE}" > "$STATE_FILE" 2>/dev/null || true
          else
            echo "pipeline-state branch not found yet (first run)."
          fi

      - name: Detect upstream change
        id: detect
        env:
          FORCE: ${{ inputs.force }}
        run: sh tools/pipeline/lib/detect.sh

  # ---------------------------------------------------------------------------
  # BUILD (§4 steps D..P): only runs when detect says the upstream moved.
  # ---------------------------------------------------------------------------
  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
      LAST_BUILT_SHA: ${{ needs.detect.outputs.last_built_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # --- Checkout tasker with FULL history (versionCode = commit count). ----
      - name: Check out tasker (full history + submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TASKER_BRANCH }}
          fetch-depth: 0          # full history: nanogiants versionCode needs it
          fetch-tags: true        # existing v<code>-tasker.N tags for N bump
          submodules: recursive
          # Persist the token so our scripts can push tasker + tags + state.
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name  "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"

      # --- Toolchain (mirror build.yml: Temurin 17). --------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (build-tools apksigner/zipalign)
        # TODO(pin): replace @<pin-sha> with the commit SHA for
        #   android-actions/setup-android@v3
        uses: android-actions/setup-android@<pin-sha>

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: pipeline-gradle-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            pipeline-gradle-${{ runner.os }}-

      # --- REBASE (§4 D): restore rerere cache, rebase, abort+issue on conflict.
      - name: Rebase tasker onto upstream/master
        id: rebase
        run: sh tools/pipeline/lib/rebase.sh

      - name: Open CONFLICT issue
        if: failure() && steps.rebase.outcome == 'failure'
        run: |
          sh tools/pipeline/lib/issue.sh CONFLICT \
            "Rebase conflict re-applying tasker onto upstream/master"

      # --- TAP-IMPACT (§4 G): anchor-comment grep on libpebble3. --------------
      - name: Tap-drift check
        id: tapcheck
        run: sh tools/pipeline/lib/tap-check.sh

      - name: Open TAP DRIFT issue
        if: failure() && steps.tapcheck.outcome == 'failure'
        run: |
          sh tools/pipeline/lib/issue.sh TAP-DRIFT \
            "Patch tap anchors drifted after rebase"

      # --- PROVISION INPUTS (§4 I): google-services.json + local.properties. --
      - name: Provision build inputs
        run: |
          set -eu
          # Firebase config: use the committed dummy (build.yml does the same).
          cp composeApp/src/google-services-dummy.json composeApp/src/google-services.json
          # local.properties: point at the runner SDK; CI release path (not the
          # debug-signed LOCAL_RELEASE_BUILD path) so the release signingConfig
          # is exercised. We sign explicitly afterwards regardless (sign.sh).
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "LOCAL_RELEASE_BUILD=false"
          } > local.properties

      # --- BUILD + TESTS (§4 J). ---------------------------------------------
      # assembleRelease + the tasker-bridge unit tests (incl. the golden-JSON
      # contract test, HLDD-002 §8.6). The release signingConfig reads
      # ../keystore.jks + RELEASE_KEYSTORE_* env, so we decode the shared key to
      # that path and export the env (zero build patch, HLDD-004 §4 step L note).
      - name: Build release + run tasker-bridge tests
        id: build
        env:
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          # Package read auth (mirrors build.yml) for GitHub Packages deps.
          GITHUB_ACTOR: ${{ secrets.READ_PACKAGES_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
        run: |
          set -eu
          # Decode the shared keystore to the path the gradle signingConfig reads.
          printf '%s' "$APP_KEYSTORE_B64" | base64 -d > keystore.jks
          chmod 600 keystore.jks
          ./gradlew --no-daemon \
            :composeApp:assembleRelease \
            :tasker-bridge:testDebugUnitTest

      - name: Upload build reports on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            composeApp/build/reports/**
            tasker-bridge/build/reports/**
          if-no-files-found: ignore

      - name: Open BUILD FAIL issue
        if: failure() && steps.build.outcome == 'failure'
        run: |
          sh tools/pipeline/lib/issue.sh BUILD-FAIL \
            "assembleRelease / tasker-bridge tests failed"

      # --- Locate the release APK + read its versionCode. ---------------------
      - name: Resolve APK + versionCode
        id: apk
        run: |
          set -eu
          # The release APK lands under composeApp/build/outputs/apk/release/.
          APK="$(find composeApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)"
          test -n "$APK" || { echo "no release APK found" >&2; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          # versionCode == upstream commit count (nanogiants metric, §3).
          VC="$(git rev-list --count HEAD)"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "Release APK: $APK (versionCode=$VC)"

      # --- SIGN + VERIFY (§4 L): explicit apksigner pass with the shared key. -
      - name: Sign + verify APK
        id: sign
        env:
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -eu
          sh tools/pipeline/lib/sign.sh \
            "${{ steps.apk.outputs.apk }}" \
            "app-release-signed.apk"

      - name: Open SIGN FAIL issue
        if: failure() && steps.sign.outcome == 'failure'
        run: |
          sh tools/pipeline/lib/issue.sh SIGN-FAIL \
            "APK signing / verification failed"

      # --- SMOKE (§4 M): KVM-accelerated emulator boot + bridge-bind check. ----
      # Enable nested KVM for the runner (the documented 99-kvm4all.rules step).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator boot smoke
        id: smoke
        # TODO(pin): replace @<pin-sha> with the commit SHA for
        #   reactivecircus/android-emulator-runner@v2
        uses: reactivecircus/android-emulator-runner@<pin-sha>
        with:
          api-level: 35                 # tracks targetSdk (libs.versions.toml)
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-boot-anim -camera-back none
          disable-animations: true
          # Boot + bridge-bind self-check (§4 step M). Kept inline because the
          # emulator-runner action provides the booted device; logic is a few
          # adb calls. Failure (non-zero) trips the SMOKE FAIL path below.
          script: |
            set -eu
            adb wait-for-device
            # Install the SIGNED release APK we just produced.
            adb install -r app-release-signed.apk
            # Launch the app's main activity and assert the process comes up.
            adb shell monkey -p coredevices.coreapp -c android.intent.category.LAUNCHER 1
            # Give it a moment to start the bridge service, then assert the
            # process is alive (boot + bind self-check). Capture logcat for the
            # issue body either way.
            sleep 20
            adb logcat -d > /tmp/pipeline-logcat.txt 2>/dev/null || true
            if ! adb shell pidof coredevices.coreapp >/dev/null 2>&1; then
              echo "smoke: app process not running after launch" >&2
              exit 1
            fi
            echo "smoke: app booted and process alive."

      - name: Upload emulator logcat on failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: /tmp/pipeline-logcat.txt
          if-no-files-found: ignore

      - name: Open SMOKE FAIL issue
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          sh tools/pipeline/lib/issue.sh SMOKE-FAIL \
            "Emulator boot / bridge-bind smoke failed" \
            /tmp/pipeline-logcat.txt

      # --- PUBLISH (§4 O/P): release + sha256 + changelog; advance state. -----
      - name: Publish release + advance state
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          sh tools/pipeline/lib/publish.sh \
            "app-release-signed.apk" \
            "${{ steps.apk.outputs.version_code }}" \
            "${{ env.UPSTREAM_SHA }}" \
            "${{ env.LAST_BUILT_SHA }}"

      - name: Open PUBLISH FAIL issue
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          sh tools/pipeline/lib/issue.sh PUBLISH-FAIL \
            "Release publish / state advance failed"

      - name: Summary
        if: success()
        run: |
          {
            echo "## Upstream-sync build succeeded"
            echo "- Upstream: \`${UPSTREAM_SHA}\`"
            echo "- Release tag: \`${{ steps.publish.outputs.tag }}\`"
            echo "- versionCode: \`${{ steps.apk.outputs.version_code }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
